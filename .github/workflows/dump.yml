name: Dump YouTube Playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch playlist via Innertube
        run: python3 dump.py

      - name: Upload playlist.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-json
          path: playlist.json
          if-no-files-found: ignore

      - name: Commit and push playlist.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "Add playlist dump" || echo "nothing to commit"
          git push origin HEAD:main || echo "push failed (token may be read-only)"
